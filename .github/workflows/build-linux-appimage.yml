name: Build Linux AppImage

# Same trigger convention as the Windows/macOS builds: the CI/infra branch only, or run by hand.
#
# Built inside an ubuntu:22.04 container on purpose. An AppImage uses the C library of the machine it runs on,
# so what it needs is fixed by the machine it was built on: the first one was built by hand on a recent
# system and needed glibc 2.38 / GLIBCXX 3.4.32, which fails on every older distribution (reported by the
# AppImage catalog's automatic test, https://github.com/AppImage/appimage.github.io/pull/9619). 22.04 is the
# oldest Ubuntu LTS still supported; move this to the then-oldest LTS when it goes out of support.
on:
  push:
    branches: [ci/windows-macos-builds]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  appimage:
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    timeout-minutes: 60
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential cmake git curl ca-certificates file binutils pkg-config \
            libasound2-dev libjack-jackd2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev \
            libxrandr-dev libxrender-dev libglu1-mesa-dev mesa-common-dev \
            libcurl4-openssl-dev libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache JUCE FetchContent checkout
        uses: actions/cache@v4
        with:
          path: plugin/build/_deps/juce-src
          key: juce-8.0.15-linux-appimage-v1

      - name: Configure
        working-directory: plugin
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build the Standalone
        working-directory: plugin
        run: cmake --build build --target D110EmulatorNative_Standalone -j"$(nproc)"

      - name: Package the AppImage
        run: |
          VERSION=$(git describe --tags --always)
          bash scripts/make_appimage.sh \
            --name Di-111 \
            --binary plugin/build/D110EmulatorNative_artefacts/Release/Standalone/Di-111 \
            --icon docs/app_icon_256.png \
            --comment "Multi-timbral sound module emulator" \
            --version "$VERSION" \
            --bundle libjack.so.0 --bundle libdb-5.3.so \
            --out dist

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: di111-linux-appimage
          path: dist/Di-111-x86_64.AppImage
