name: Build Linux AppImage and zip

# Same trigger convention as the Windows/macOS builds: the CI/infra branch only, or run by hand.
#
# Built inside an ubuntu:22.04 container on purpose. An AppImage uses the C library of the machine it runs on,
# so what it needs is fixed by the machine it was built on: the first one was built by hand on a recent
# system and needed glibc 2.38 / GLIBCXX 3.4.32, which fails on every older distribution (reported by the
# AppImage catalog's automatic test, https://github.com/AppImage/appimage.github.io/pull/9619). 22.04 is the
# oldest Ubuntu LTS still supported; move this to the then-oldest LTS when it goes out of support. The same
# build also produces Di-111_linux.zip (Standalone, VST3, LV2, CLAP), so that none of the Linux files needs a
# newer C library than that.
on:
  push:
    branches: [ci/windows-macos-builds, ci/linux-build]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  appimage:
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    timeout-minutes: 60
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential cmake git curl ca-certificates file binutils pkg-config zip \
            libasound2-dev libjack-jackd2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev \
            libxrandr-dev libxrender-dev libglu1-mesa-dev mesa-common-dev \
            libcurl4-openssl-dev libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache JUCE FetchContent checkout
        uses: actions/cache@v4
        with:
          path: plugin/build/_deps/juce-src
          key: juce-8.0.15-linux-appimage-v1

      - name: Configure
        working-directory: plugin
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build Standalone, VST3, LV2 and CLAP
        working-directory: plugin
        run: |
          cmake --build build -j"$(nproc)" \
            --target D110EmulatorNative_Standalone D110EmulatorNative_VST3 D110EmulatorNative_LV2 D110EmulatorNative_CLAP

      - name: Assemble Di-111_linux.zip
        run: |
          A=plugin/build/D110EmulatorNative_artefacts/Release
          mkdir -p dist/Di-111_linux/Standalone dist/Di-111_linux/VST3 dist/Di-111_linux/LV2 dist/Di-111_linux/CLAP
          cp "$A/Standalone/Di-111" dist/Di-111_linux/Standalone/
          cp -r "$A/VST3/Di-111.vst3" dist/Di-111_linux/VST3/
          cp -r "$A/LV2/Di-111.lv2" dist/Di-111_linux/LV2/
          cp "$(find plugin/build -name 'Di-111.clap' | head -1)" dist/Di-111_linux/CLAP/
          find dist/Di-111_linux -type f \( -name 'Di-111' -o -name '*.so' -o -name '*.clap' \) -exec strip {} +
          (cd dist && zip -qr Di-111_linux.zip Di-111_linux)
          echo "highest glibc symbol version needed:"
          objdump -T dist/Di-111_linux/Standalone/Di-111 | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1

      - name: Package the AppImage
        run: |
          # the container's git refuses a workspace owned by another user ("dubious ownership")
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          VERSION=$(git describe --tags --always)
          bash scripts/make_appimage.sh \
            --name Di-111 \
            --binary plugin/build/D110EmulatorNative_artefacts/Release/Standalone/Di-111 \
            --icon docs/app_icon_256.png \
            --comment "Multi-timbral sound module emulator" \
            --version "$VERSION" \
            --bundle libjack.so.0 --bundle libdb-5.3.so \
            --out dist

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: di111-linux-appimage
          path: dist/Di-111-x86_64.AppImage

      - name: Upload Linux zip
        uses: actions/upload-artifact@v4
        with:
          name: di111-linux-zip
          path: dist/Di-111_linux.zip
